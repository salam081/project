<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    

   <style>

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      
      :root {
        --brand-deep: #4a3880;
        --brand-mid: #5c4b9e;
        --brand-accent: #667eea;
        --brand-light: #c4b5fd;
        --glass-bg: rgba(255, 255, 255, 0.1);
        --glass-border: #e5e7eb;
        --text-primary: #1e1b4b;
        --text-muted: #6b7280;
        --input-bg: #f9fafb;
        --input-border: #e5e7eb;
        --input-focus: #764ba2;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        font-family: 'DM Sans', sans-serif;
        
       overflow: hidden;
      }

      /* ── Floating orbs ── */
      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(70px);
        opacity: 0.25;
        animation: drift 14s ease-in-out infinite alternate;
        pointer-events: none;
      }
      .orb-1 {
        width: 420px; height: 420px;
        background: #a78bfa;
        top: -120px; left: -100px;
        animation-delay: 0s;
      }
      .orb-2 {
        width: 300px; height: 300px;
        background: #667eea;
        bottom: -80px; right: -60px;
        animation-delay: -5s;
      }
      .orb-3 {
        width: 200px; height: 200px;
        background: #c084fc;
        top: 50%; right: 8%;
        animation-delay: -9s;
      }
      
      @keyframes drift {
        from { transform: translate(0, 0) scale(1); }
        to   { transform: translate(30px, 20px) scale(1.08); }
      }

      /* Grid texture */
      .grid-texture {
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
        background-size: 48px 48px;
        pointer-events: none;
      }

      /* ── Wrapper ── */
      .login-wrapper {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 400px;
        padding: 20px;
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(36px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* ── Card ── */
      .login-card {
        background: #ffffff;
        border-radius: 24px;
        padding: 1.4rem 1.6rem 1.4rem;
        width: 100%;
        animation: slideUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
        
       
      }

      /* ── Brand area ── */
      .brand-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 0.9rem;
      }
      .logo-ring {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 0.75rem;
      }
      .logo-ring img {
        height: 80px;
        width: 80px;
        margin-top: 0.5rem;
      }
      .brand-title {
        font-family: 'Playfair Display', serif;
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--text-primary);
        letter-spacing: -0.02em;
        text-align: center;
        line-height: 1.3;
      }
      .brand-subtitle {
        font-size: 0.82rem;
        color: var(--text-muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 400;
        text-align: center;
        margin-top: 0.2rem;
      }

      /* ── Divider ── */
      .divider {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 0.8rem;
      }
      .divider-line {
        flex: 1;
        height: 1px;
        background: var(--glass-border);
      }
      .divider-text {
        font-size: 0.7rem;
        color: var(--text-muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      /* ── Alerts ── */
      .alert-custom {
        background: rgba(246, 11, 11, 0.1);
        border: 1px solid rgba(150, 183, 16, 0.25);
        border-radius: 10px;
        color: #560202;
        font-size: 0.83rem;
        padding: 0.65rem 0.9rem;
        margin-bottom: 1rem;
      }
      .alert-success {
        background: rgba(25, 181, 82, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.25);
        border-radius: 10px;
        color: #16a34a;
        font-size: 0.83rem;
        padding: 0.65rem 0.9rem;
        margin-bottom: 1rem;
      }

      /* ── Form fields ── */
      .field-group {
        margin-bottom: 0.75rem;
      }
      .field-label {
        display: block;
        font-size: 0.78rem;
        font-weight: 500;
        color: var(--text-muted);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 0.4rem;
      }
      .field-wrap {
        position: relative;
      }
      .field-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: #9ca3af;
        pointer-events: none;
        display: flex;
        align-items: center;
      }
      .field-input {
        width: 100%;
        background: var(--input-bg);
        border: 1px solid var(--input-border);
        border-radius: 12px;
        color: #1e1b4b;
        font-family: 'DM Sans', sans-serif;
        font-size: 0.95rem;
        font-weight: 400;
        padding: 0.78rem 2.8rem 0.78rem 2.75rem;
        transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        outline: none;
        -webkit-appearance: none;
        appearance: none;
      }
      .field-input::placeholder {
        color: #c4b5fd;
      }
      .field-input:focus {
        border-color: var(--input-focus);
        background: #faf5ff;
        box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.12);
      }

      /* Password toggle button */
      .toggle-btn {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        color: #9ca3af;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4px;
        line-height: 1;
        transition: color 0.2s;
        min-width: 32px;
        min-height: 32px;
      }
      .toggle-btn:hover {
        color: #764ba2;
      }
      .toggle-btn .eye-off { display: none; }
      .toggle-btn.show-pw .eye-on  { display: none; }
      .toggle-btn.show-pw .eye-off { display: block; }

      /* ── Submit button ── */
      .btn-login {
        width: 100%;
        margin-top: 0.7rem;
        padding: 0.7rem;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff;
        font-family: 'DM Sans', sans-serif;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.03em;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(118, 75, 162, 0.4);
        transition: transform 0.18s, box-shadow 0.18s;
        min-height: 48px;
      }
      .btn-login::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 60%);
        pointer-events: none;
      }
      .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(118, 75, 162, 0.5);
      }
      .btn-login:active {
        transform: translateY(0);
      }

      /* ── Footer link ── */
      .card-footer-area {
        margin-top: 0.8rem;
        padding-top: 0.6rem;
        border-top: 1px solid var(--glass-border);
        display: flex;
        justify-content: center;
      }
      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.82rem;
        color: #764ba2;
        text-decoration: none;
        transition: color 0.2s;
        padding: 4px 0;
      }
      .back-link:hover { color: #667eea; }
      .back-link svg { transition: transform 0.2s; }
      .back-link:hover svg { transform: translateX(-3px); }

      /* ── Mobile ── */
      @media (max-width: 480px) {
        body { align-items: flex-start; padding-top: 24px; }
        .login-card { border-radius: 20px; }
        .logo-ring img { height: 75px; width: 75px; }
        .brand-title { font-size: 1.15rem; }
        .field-input { font-size: 1rem; padding: 0.82rem 2.8rem 0.82rem 2.75rem; }
        .btn-login { font-size: 1rem; }
      }
      @media (max-width: 360px) {
        .login-card { border-radius: 16px; }
      }
    </style>
</head>
<body>
    
    <!-- Background -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-texture"></div>

    <div class="login-wrapper">
      <div class="login-card">

        <!-- Logo -->
        <div class="brand-area">
          <div class="logo-ring">
            <img src="{% static 'assets/images/tmcsl.png' %}" alt="Logo"/>
          </div>
          <div class="brand-title">Change Your Password</div>
        
        </div>

        <!-- Divider -->
       

        <form method="post">
          {% csrf_token %}

         {% for message in messages %}
            <div class="
                {% if 'success' in message.tags %}
                    alert-success
                {% else %}
                    alert-custom
                {% endif %}
            ">
                {{ message }}
            </div>
          {% endfor %}

          <!-- OLD PASSWORD -->
          <div class="field-group">
            <label class="field-label" for="id_old_password">Current Password</label>
            <div class="field-wrap">
              <span class="field-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input type="password" id="id_old_password" name="old_password"
                     class="field-input" placeholder="Enter Current password" required>
              <button type="button" class="toggle-btn" onclick="togglePw(this,'id_old_password')" aria-label="Toggle password visibility">
                <!-- Eye on -->
                <svg class="eye-on" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <!-- Eye off -->
                <svg class="eye-off" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- NEW PASSWORD -->
          <div class="field-group">
            <label class="field-label" for="id_new_password1">New Password</label>
            <div class="field-wrap">
              <span class="field-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
                </svg>
              </span>
              <input type="password" id="id_new_password1" name="new_password1"
                     class="field-input" placeholder="Enter new password" required>
              <button type="button" class="toggle-btn" onclick="togglePw(this,'id_new_password1')" aria-label="Toggle password visibility">
                <svg class="eye-on" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-off" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- CONFIRM PASSWORD -->
          <div class="field-group">
            <label class="field-label" for="id_new_password2">Confirm Password</label>
            <div class="field-wrap">
              <span class="field-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
              </span>
              <input type="password" id="id_new_password2" name="new_password2"
                     class="field-input" placeholder="Confirm new password" required>
              <button type="button" class="toggle-btn" onclick="togglePw(this,'id_new_password2')" aria-label="Toggle password visibility">
                <svg class="eye-on" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-off" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- SUBMIT -->
          <button type="submit" class="btn-login">Change Password</button>
        </form>

        <!-- Footer -->
        <div class="card-footer-area">
          <a href="{% url 'login' %}" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"/>
              <polyline points="12 19 5 12 12 5"/>
            </svg>
            Login
          </a>
        </div>

      </div><!-- /.login-card -->
    </div><!-- /.login-wrapper -->

    <script>
      function togglePw(btn, inputId) {
        const input = document.getElementById(inputId);
        const isText = input.type === 'text';
        input.type = isText ? 'password' : 'text';
        btn.classList.toggle('show-pw', !isText);
      }
    </script>



</body>
</html>
