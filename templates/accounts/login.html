<!DOCTYPE html>
<html lang="en">
  {% load static %}
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Login</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      
      :root {
        --brand-deep: #4a3880;
        --brand-mid: #5c4b9e;
        --brand-accent: #667eea;
        --brand-light: #c4b5fd;
        --glass-bg: rgba(255, 255, 255, 0.1);
        --glass-border: #e5e7eb;
        --text-primary: #1e1b4b;
        --text-muted: #6b7280;
        --input-bg: #f9fafb;
        --input-border: #e5e7eb;
        --input-focus: #764ba2;
      }
      
      body {
        font-family: 'DM Sans', sans-serif;
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        
         background: linear-gradient(to right, rgba(15, 23, 42, 0.9) 0%, rgba(15, 23, 42, 0.4) 100%);
      }
      
      /* ── Layered background ── */
      .bg-layer {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: radial-gradient(ellipse 70% 55% at 15% 15%, rgba(255, 255, 255, 0.08) 0%, transparent 60%), radial-gradient(ellipse 55% 45% at 85% 80%, rgba(0, 0, 0, 0.15) 0%, transparent 55%);
      }
      
      /* Floating orbs */
      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(70px);
        opacity: 0.25;
        animation: drift 14s ease-in-out infinite alternate;
        pointer-events: none;
      }
      .orb-1 {
        width: 420px;
        height: 420px;
        background: #a78bfa;
        top: -120px;
        left: -100px;
        animation-delay: 0s;
      }
      .orb-2 {
        width: 300px;
        height: 300px;
        background: #667eea;
        bottom: -80px;
        right: -60px;
        animation-delay: -5s;
      }
      .orb-3 {
        width: 200px;
        height: 200px;
        background: #c084fc;
        top: 50%;
        right: 8%;
        animation-delay: -9s;
      }
      
      @keyframes drift {
        from {
          transform: translate(0, 0) scale(1);
        }
        to {
          transform: translate(30px, 20px) scale(1.08);
        }
      }
      
      /* Grid texture */
      .grid-texture {
        position: fixed;
        inset: 0;
        background-image: linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 48px 48px;
        pointer-events: none;
      }
      
      /* ── Card ── */
      .login-wrapper {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 400px;
        margin: auto; /* ✅ ensures centering */
      }
      
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(36px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      .login-card {
        background: #ffffff;
        border: none;
        border-radius: 24px;
        padding: 1.4rem 1.4rem 1.2rem;
        width: 100%;
        max-width: 360px; /* 💻 smaller on desktop */
        margin: 0 auto;
      }
      
      /* ── Logo / brand area ── */
      .brand-area {
        display: flex;
        flex-direction: column;
        align-items: center;
      
        margin-bottom: 0.8rem;
      }
      
      .logo-ring {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 0.75rem;
      }
      
      .logo-ring img {
        height: 85px;
        width: 85px;
        margin-top: 0.5rem;
      }
      
      .brand-title {
        font-family: 'Playfair Display', serif;
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--text-primary);
        letter-spacing: -0.02em;
        text-align: center;
        line-height: 1.3;
      }
      
      .brand-subtitle {
        font-size: 0.82rem;
        color: var(--text-muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 400;
        text-align: center;
        margin-top: 0.2rem;
      }
      
      /* ── Divider ── */
      .divider {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 0.7rem;
      }
      .divider-line {
        flex: 1;
        height: 1px;
        background: var(--glass-border);
      }
      .divider-text {
        font-size: 0.7rem;
        color: var(--text-muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      
      /* ── Alerts ── */
      .alert-custom {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.25);
        border-radius: 10px;
        color: #dc2626;
        font-size: 0.83rem;
        padding: 0.65rem 0.9rem;
        margin-bottom: 1rem;
      }
      
      .alert-success {
        background: rgba(25, 181, 82, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.25);
        border-radius: 10px;
        color: #16a34a;
        font-size: 0.83rem;
        padding: 0.65rem 0.9rem;
        margin-bottom: 1rem;
      }
      
      /* ── Form fields ── */
      .field-group {
        margin-bottom: 0.6rem;
      }
      
      .field-label {
        display: block;
        font-size: 0.78rem;
        font-weight: 500;
        color: var(--text-muted);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 0.4rem;
      }
      
      .field-wrap {
        position: relative;
      }
      
      .field-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: #9ca3af;
        pointer-events: none;
        display: flex;
        align-items: center;
      }
      
      .field-input {
        width: 100%;
        background: var(--input-bg);
        border: 1px solid var(--input-border);
        border-radius: 12px;
        color: #1e1b4b;
        font-family: 'DM Sans', sans-serif;
        font-size: 0.95rem;
        font-weight: 400;
        padding: 0.78rem 2.6rem 0.78rem 2.75rem;
        transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        outline: none;
        -webkit-appearance: none;
        appearance: none;
      }
      
      .field-input::placeholder {
        color: #c4b5fd;
      }
      
      .field-input:focus {
        border-color: var(--input-focus);
        background: #faf5ff;
        box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.12);
      }
      
      /* password toggle */
      .toggle-btn {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        color: #9ca3af;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4px;
        line-height: 1;
        transition: color 0.2s;
        /* Ensure tap target is large enough on mobile */
        min-width: 32px;
        min-height: 32px;
      }
      .toggle-btn:hover {
        color: #764ba2;
      }
      
      /* ── Submit button ── */
      .btn-login {
        width: 100%;
        margin-top: 0.7rem;
        padding: 0.7rem;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff;
        font-family: 'DM Sans', sans-serif;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.03em;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(118, 75, 162, 0.4);
        transition: transform 0.18s, box-shadow 0.18s;
        /* Better touch target */
        min-height: 48px;
      }
      
      .btn-login::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, transparent 60%);
        pointer-events: none;
      }
      
      .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(118, 75, 162, 0.5);
      }
      
      .btn-login:active {
        transform: translateY(0);
      }
      
      /* ── Footer link ── */
      .card-footer-area {
        margin-top: 0.7rem;
        padding-top: 0.6rem;
        border-top: 1px solid var(--glass-border);
        display: flex;
        justify-content: center;
      }
      
      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.82rem;
        color: #764ba2;
        text-decoration: none;
        transition: color 0.2s;
        padding: 4px 0;
      }
      .back-link:hover {
        color: #667eea;
      }
      .back-link svg {
        transition: transform 0.2s;
      }
      .back-link:hover svg {
        transform: translateX(-3px);
      }
      
      /* ── Mobile Responsive ── */
      @media (max-width: 480px) {
        body {
          align-items: center;
        }
      
        .login-wrapper {
          max-width: 100%;
        }
      
        .login-card {
          padding: 1.4rem 1.4rem 1.2rem;
          border-radius: 20px;
        }
      
        .logo-ring img {
          height: 90px;
          width: 90px;
        }
      
        .brand-title {
          font-size: 1.15rem;
        }
      
        .field-input {
          font-size: 1rem; /* prevents iOS zoom on focus */
          padding: 0.82rem 2.6rem 0.82rem 2.75rem;
        }
      
        .btn-login {
          font-size: 1rem;
        }
      }
      
      /* Very small screens */
      @media (max-width: 360px) {
        .login-card {
          max-height: 100%;
          max-width: 100%; /* 📱 full width */
          width: 100%;
          border-radius: 16px; /* optional: nicer on mobile */
        }
      
        .divider-text {
          font-size: 0.65rem;
          letter-spacing: 0.05em;
        }
      }
    </style>
  </head>
  <body>
    <!-- Background layers -->
    <div class="bg-layer"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-texture"></div>

    <!-- Login card -->
    <div class="login-wrapper">
      <div class="login-card">
        <!-- Brand / Logo -->
        <div class="brand-area">
          <div class="logo-ring">
            <img src="{% static 'assets/images/tmcsl.png' %}" alt="TMCSL Logo" />
          </div>
          <div class="brand-title">Trust Cooperative</div>
        </div>

        <!-- Section label -->
        <div class="divider">
          <div class="divider-line"></div>
          <div class="brand-title">Sign in with your credentials</div>
          <div class="divider-line"></div>
        </div>

        <!-- Django Login Form -->
        <form method="post">
          {% csrf_token %}

          <!-- Flash messages -->
          {% for message in messages %}
            <div class="alert-custom" role="alert">{{ message }}</div>
          {% endfor %}

          <!-- Username -->
          <div class="field-group">
            <label for="id_username" class="field-label">Username</label>
            <div class="field-wrap">
              <span class="field-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
              </span>
              <input type="text" name="username" id="id_username" class="field-input" placeholder="Enter your Ippis" required autofocus autocomplete="username" />
            </div>
          </div>

          <!-- Password -->
          <div class="field-group">
            <label for="id_password" class="field-label">Password</label>
            <div class="field-wrap">
              <span class="field-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
              </span>
              <input type="password" name="password" id="id_password" class="field-input" placeholder="Enter your password" required autocomplete="current-password" />
             
            </div>
          </div>

          <!-- Submit -->
          <button type="submit" class="btn-login">Sign In</button>
        </form>

        <!-- Footer -->
        <div class="card-footer-area">
          <a href="{% url 'home' %}" class="back-link">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6" />
            </svg>Back to Home
          </a>
        </div>
      </div>
    </div>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script>
      function togglePassword() {
        const input = document.getElementById('id_password')
        const icon = document.getElementById('eye-icon')
        const isHidden = input.type === 'password'
        input.type = isHidden ? 'text' : 'password'
        icon.innerHTML = isHidden
          ? `<line x1="1" y1="1" x2="23" y2="23"/>
                               <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 11 7 11 7a13.16 13.16 0 0 1-1.67 2.68"/>
                               <path d="M6.61 6.61A13.526 13.526 0 0 0 1 12s4 8 11 8a9.74 9.74 0 0 0 5.39-1.61"/>
                               <line x1="1" y1="1" x2="23" y2="23"/>`
          : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                               <circle cx="12" cy="12" r="3"/>`
      }
    </script>
  </body>
</html>
