<!DOCTYPE html>
<html lang="en">
    {% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
    <!-- Load Bootstrap 5 CSS -->
    {% comment %} <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"> {% endcomment %}
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <!-- Optional: Use Inter font, similar to the previous version -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
             background: -webkit-gradient(linear, left top, left bottom, from(#e6e5f2), to(#4599cd));
             background: linear-gradient(135deg, #87ceeb 0%, #6db4d4 100%);
        }
       
       
        .login-card-wrapper {
            min-height: 100vh;
        }
    </style>
</head>
<body class="login-card-wrapper d-flex flex-column justify-content-center align-items-center">

    <div class="container">
        <div class="row justify-content-center">
            <!-- Login Card Container -->
            <div class="col-11 col-sm-6 col-md-6 col-lg-5 col-xl-4">
                <div class="card shadow-lg border-0 rounded-4 p-4 p-sm-5">

                    <!-- Header -->
                    <h1 class="h3 fw-bold text-center text-dark mb-2">
                        Welcome Back
                    </h1>
                    <p class="text-center text-muted mb-4">
                        Sign in to access your Account.
                    </p>

                    <!-- Django Login Form -->
                    <form method="post" class="login-form">
                        {% csrf_token %}

                        <!-- Placeholder for non-field errors (e.g., failed login attempts) -->
                        {% for message in messages %}
                            <div class="alert alert-info mb-3 rounded-3" role="alert">
                                {{ message }}
                            </div>
                         {% endfor %} 

                        <!-- Username or Email Field (Static Input) -->
                        <div class="mb-3">
                            <label for="id_username" class="form-label small fw-medium text-dark">
                                Username 
                            </label>
                            <div class="django-form-field">
                                <input type="text" 
                                       name="username" 
                                       id="id_username" 
                                       class="form-control rounded-3" 
                                       placeholder="Enter your username "
                                       required 
                                       autofocus>
                            </div>
                        </div>

                        <!-- Password Field (Static Input) -->
                        <div class="mb-3">
                            <label for="id_password" class="form-label small fw-medium text-dark">
                                Password
                            </label>
                            <div class="django-form-field">
                                <input type="password" 
                                       name="password" 
                                       id="id_password" 
                                       class="form-control rounded-3" 
                                       placeholder="Enter your password"
                                       required>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit"
                                class="w-100 btn btn-primary btn-lg mt-3 rounded-3 shadow-sm fw-semibold">
                            Log In
                        </button>
                    </form>

                    <!-- Footer/Links -->
                    <div class="mt-4 text-center small">
                        <a href="{% url 'home' %}" class="text-decoration-none text-primary fw-medium">
                         Go Back
                        </a>
                       
                    </div>

                </div>
            </div>
        </div>
    </div>
    
    <!-- Load Bootstrap 5 JS -->
    <script src="{% static 'js/bootstrap.bundle.min.js'%}"></script>
   
</body>
</html>
