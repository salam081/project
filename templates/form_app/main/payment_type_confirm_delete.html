{% extends "base/base.html" %}

{% block content %}
<div class="container py-4" style="max-width: 480px;">
  <div class="card shadow-sm border-danger">
    <div class="card-header bg-danger text-white">
      <h6 class="mb-0"><i class="bi bi-exclamation-triangle"></i> Confirm Delete</h6>
    </div>
    <div class="card-body">
      <p>Are you sure you want to delete the payment type <strong>{{ payment_type.title }}</strong>?</p>
      <p class="text-muted small">This action cannot be undone. Any payments linked to this type may be affected.</p>
      <form method="post" class="d-flex gap-2">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">
          <i class="bi bi-trash"></i> Yes, Delete
        </button>
        <a href="{% url 'payment_type_list' %}" class="btn btn-outline-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
