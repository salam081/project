{% extends 'base/base.html' %}

{% block content %}
  <div class="container mt-5">
   
      
          <div class="bg-light  rounded-3 border mb-5">
            <p class=" fw-bold text-dark mb-3">Write a New Application Letter</p>
            <form method="post">
              {% csrf_token %}
              <div class="mb-3">
                {% comment %} <label for="application_letter" class="form-label text-secondary">Application Letter</label> {% endcomment %}
                <textarea name="application_letter" id="application_letter" rows="6" class="form-control rounded-3" placeholder="Write your detailed application letter here..." required></textarea>
              </div>
              <button type="submit" class="btn btn-primary w-100 fw-bold py-2 rounded-3 shadow-sm">Submit Application</button>
            </form>
          </div>

    
  </div>
{% endblock %}
