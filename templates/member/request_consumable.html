{% extends 'base/base.html' %}
{% load static %}
{% block content %}

<style>
    :root {
        --primary-color: #667eea;
        --primary-dark-color: #5563d1;
        --secondary-color: #764ba2;
        --background-light: #f4f6f9;
        --border-color: #e1e5e9;
        --text-color: #333;
        --label-color: #6c757d;
    }

    body {
        background-color: var(--background-light);
    }

    .content-card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        padding: 40px;
    }

    .form-header h2 {
        font-size: 2rem;
        font-weight: 600;
        color: var(--text-color);
        margin-bottom: 2rem;
    }

    .form-group {
        margin-bottom: 24px;
    }

    .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: var(--label-color);
        font-size: 0.9rem;
    }

    .form-group input,
    .form-group select {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid var(--border-color);
        border-radius: 8px;
        font-size: 1rem;
        transition: all 0.3s ease;
        background: white;
    }

    .form-group input:focus,
    .form-group select:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .form-group input[type="file"] {
        padding: 6px 10px;
        background: var(--background-light);
        border-style: dashed;
    }

    .section-title {
        font-size: 1.4rem;
        font-weight: 600;
        color: var(--text-color);
        margin: 40px 0 24px 0;
        padding-bottom: 12px;
        border-bottom: 2px solid var(--primary-color);
    }

    #item-selection-container {
        background: var(--background-light);
        border-radius: 12px;
        padding: 20px;
        border: 1px solid var(--border-color);
    }

    .item-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 15px;
        background: white;
        border-radius: 8px;
        margin-bottom: 12px;
        border: 1px solid var(--border-color);
        transition: all 0.3s ease;
    }

    .item-row:hover {
        border-color: var(--primary-color);
        box-shadow: 0 2px 8px rgba(102, 126, 234, 0.1);
    }

    .item-row input[type="checkbox"] {
        width: 20px;
        height: 20px;
        cursor: pointer;
        accent-color: var(--primary-color);
    }

    .item-info {
        flex: 1;
        display: flex;
        flex-direction: column;
    }
    
    .item-info label {
        font-weight: 500;
        color: var(--text-color);
        margin: 0;
        cursor: pointer;
    }

    .price {
        font-weight: 600;
        color: #28a745;
    }

    .stock-info {
        font-size: 0.8rem;
        color: var(--label-color);
        margin-top: 4px;
    }

    .quantity-control {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .item-row input[type="number"] {
        width: 100px;
        padding: 8px 12px;
        border: 2px solid var(--border-color);
        border-radius: 6px;
        font-size: 0.9rem;
        transition: all 0.3s ease;
    }

    .item-row input[type="number"]:disabled {
        background: var(--background-light);
        color: var(--label-color);
        cursor: not-allowed;
    }

    .item-row input[type="number"]:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
    }

    .no-items {
        text-align: center;
        color: var(--label-color);
        font-style: italic;
        padding: 40px;
    }

    .submit-btn {
        background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        color: white;
        border: none;
        padding: 13px 22px;
        font-size: 1.1rem;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: block;
        margin: 40px auto 0;
        min-width: 200px;
    }

    .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
    }

    .submit-btn:active {
        transform: translateY(0);
    }

    /* === Mobile Styles === */
    @media (max-width: 768px) {
        .content-card {
            padding: 20px;
        }

        .form-header h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .section-title {
            font-size: 1.2rem;
            margin: 30px 0 16px 0;
        }

        /* Adjustments for a clean 2-column item layout */
        .item-row {
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 10px;
        }

        .item-row .form-check {
            margin: 0;
        }

        .item-info {
            flex: 1;
            display: block; /* Change flex-direction to row/default */
        }

        .item-info label {
            display: inline-block;
        }
        
        .quantity-control {
            flex-grow: 0;
            justify-content: flex-end;
        }

        .item-row input[type="number"] {
            width: 80px;
        }
    }
</style>

<div class="content-card mt-3">
    <div class="form-header">
        <h2>Request New Consumable</h2>
    </div>

    <div class="form-content">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row">
                <div class="form-group col-md-4">
                    <label for="id_consumable_type">Consumable Type</label>
                    <select name="consumable_type" id="id_consumable_type" required>
                        <option value="">Select a consumable type...</option>
                        {% for type in consumable_types %}
                            <option value="{{ type.id }}">{{ type.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group col-md-4">
                    <label for="id_loan_term_months">Loan Term (in Months)</label>
                    <input type="number" name="loan_term_months" id="id_loan_term_months" placeholder="e.g., 6, 12, 24" min="1" required>
                </div>

                <div class="form-group col-md-4">
                    <label for="id_file_payslpt">Payslip (Image)</label>
                    <input type="file" name="file_payslpt" id="id_file_payslpt" accept="image/*" required>
                </div>
            </div>
            
            <h3 class="section-title">Select Items</h3>
            <div id="item-selection-container">
                {% for item in selling_plans %}
                    <div class="item-row">
                        <div class="form-check">
                            <input type="checkbox" id="item_{{ item.id }}" name="selected_items" value="{{ item.id }}" class="form-check-input">
                        </div>
                        
                        <div class="item-info">
                            <label for="item_{{ item.id }}">
                                {{ item.purchased_item.item_name }} - <span class="price">₦{{ item.selling_price_per_unit|floatformat:0 }}</span>
                            </label>
                            <span class="stock-info">
                                Stock: {{ item.quantity }}
                            </span>
                        </div>
                        
                        <div class="quantity-control">
                            <input type="number" name="quantity_{{ item.id }}" placeholder="Qty" min="1" disabled>
                        </div>
                    </div>
                {% empty %}
                    <p class="no-items">No items are currently available.</p>
                {% endfor %}
            </div>

            <button type="submit" class="submit-btn">Submit Request</button>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const itemContainer = document.getElementById('item-selection-container');
        
        itemContainer.addEventListener('change', function(event) {
            if (event.target.type === 'checkbox') {
                const checkbox = event.target;
                const itemRow = checkbox.closest('.item-row');
                const quantityInput = itemRow.querySelector('input[type="number"]');
                
                if (quantityInput) {
                    quantityInput.disabled = !checkbox.checked;
                    
                    if (checkbox.checked) {
                        quantityInput.focus();
                        quantityInput.required = true;
                        quantityInput.value = 1;
                    } else {
                        quantityInput.required = false;
                        quantityInput.value = '';
                    }
                }
            }
        });

        // Add smooth scrolling for form submission
        const form = document.querySelector('form');
        form.addEventListener('submit', function(e) {
            const submitBtn = document.querySelector('.submit-btn');
            submitBtn.style.transform = 'scale(0.98)';
            setTimeout(() => {
                submitBtn.style.transform = 'scale(1)';
            }, 150);
        });
    });
</script>

{% endblock content %}
