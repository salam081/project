{% extends 'base/base.html' %}
{% load static %}
{% load humanize %}

{% block title %}
  Request Special Savings Withdrawal
{% endblock %}

{% block content %}
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow">
          <div class="card-header bg-light text-dark">
            <h5 class="mb-0 text-center">Request Special Savings Withdrawal</h5>
          </div>

          <div class="card-body">
            <!-- Available Balance -->
            <div class="mb-3">
              <label class="form-label fw-bold">Available Special Savings</label>
              <input type="text" class="form-control" value="₦{{ available_balance|floatformat:2|intcomma }}" readonly />
            </div>

            <!-- Withdrawal Form -->
            <form method="POST">
              {% csrf_token %}

              <div class="mb-3">
                <label class="form-label fw-semibold">Amount</label>
                <input type="number" name="amount" step="0.01" min="0.01" max="{{ available_balance }}" class="form-control" placeholder="Enter withdrawal amount" required />
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Reason</label>
                <textarea name="reason" class="form-control" rows="3" placeholder="Reason for withdrawal"></textarea>
              </div>

              <div class="d-flex justify-content-between">
                <a href="{% url 'my_target_savings_withdrawals' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Back</a>
                <button type="submit" class="btn btn-success"><i class="bi bi-send me-1"></i> Submit Request</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
