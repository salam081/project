{% extends 'base/base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
  <div class="card shadow-sm">
    <div class="card-header bg-danger text-white">
      <h6 class="mb-0"><i class="fas fa-trash-alt me-2"></i>Confirm Delete</h6>
    </div>

    <div class="card-body text-center">
      <p class="fs-5 mb-4">
        Are you sure you want to delete <strong>{{ item.item_name }}</strong>?
      </p>

      <form method="post" class="d-inline">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger px-4">
          <i class="bi bi-check me-1"></i> Yes, Delete
        </button>
      </form>

      <a href="{% url 'purchased_item_list' %}" class="btn btn-secondary px-4 ms-2 text-white">
        <i class="bi bi-times me-1"></i> Cancel
      </a>
    </div>
  </div>
</div>
{% endblock %}
