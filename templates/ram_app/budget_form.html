{% extends "base/base.html" %}

{% block title %}Create Budget{% endblock %}
{% block page_title %}Create Budget{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <i class="bi bi-wallet2 me-2"></i> New Budget
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Budget Name</label>
                        <input type="text" name="name" class="form-control" placeholder="e.g. RAM Budget June 2026" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Total Amount (₦)</label>
                        <input type="number" name="total_amount" class="form-control" placeholder="e.g. 500000" step="0.01" min="0" required>
                    </div>
                    <div class="mb-3">
                        <div class="form-check">
                            <input type="checkbox" name="is_active" class="form-check-input" id="is_active">
                            <label class="form-check-label" for="is_active">
                                Active Budget
                            </label>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-save me-1"></i> Submit Budget
                        </button>
                        <a href="{% url 'budget_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
