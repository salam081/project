{% extends 'base/base.html' %}
{% block content %}
  <div class="container mt-2 col-md-10">
      <div class="card shadow">
          <div class="card-header text-center text-primary">
            <h6>Add Monthly Target Savings</h6>

        </div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="">IPPIS</label>
            <input type="text" name="ippis" placeholder="Member IPPIS" class="form-control mb-2" required />
          </div>

          <div class="mb-3">
            <label for="">Month</label>
            <input type="month" name="month" class="form-control mb-2" required />
          </div>

          <div class="mb-3">
            <label for="">Savings Amount</label>
            <input type="number" step="0.01" name="amount" class="form-control mb-2" required />
          </div>

          <button type="submit" id="uploadBtn" class="btn btn-primary">Add</button>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
