{% extends 'base/base.html' %}
{% block content %}
<div class="content-card">
    <h3>Manage Permissions</h3>
    <form method="post">
        {% csrf_token %}
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Page</th>
                    {% for group in groups %}
                        <th>{{ group.title }}</th>
                    {% endfor %}
                </tr>
            </thead>
            <tbody>
                {% for item in data %}
                    <tr>
                        <td>{{ item.page_name }}</td>
                        {% for g in item.groups %}
                            <td>
                                <input 
                                    type="checkbox"
                                    name="{{ g.group.id }}_{{ item.page }}"
                                    {% if g.allowed %}checked{% endif %}
                                >
                            </td>
                        {% endfor %}
                    </tr>
                {% endfor %}
            </tbody>
        </table>
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
</div>
{% endblock %}
