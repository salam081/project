{% extends 'base/base.html' %}
{% load humanize %}
{% block content %}
<div class="content-card mt-2">
    <h3>Manage Subscription Fee</h3>
</div>
<div class="content-card mt-2">
    <div class="row">
  <div class="col-md-6">
       {% for sub in subscription %}
       <p>Amount :{{sub.amount}}
        <a href="{% url 'edit_subscription_fee' sub.id %}">Edit</a>
       </p>
       {% endfor %}
  </div>
  <div class="col-md-6">
    <form action="" method="POST">
        {% csrf_token %}
        <label for="">Enter Subscription Fee</label>
        <input type="number" class="form-control" name="amount" placeholder="Enter amount">
        <button type="submit" class="btn btn-primary"> Save</button>
    </form>
  </div>
  </div>
</div>
{% endblock content %}
